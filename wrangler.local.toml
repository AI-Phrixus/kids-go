name = "kids-go-local"
main = "workers/api/src/entry.ts"
compatibility_date = "2025-07-05"

[[d1_databases]]
binding = "DB"
database_name = "kids-go"
database_id = "35d8acbd-2abd-4a68-b62e-88dfa1f0fd0d"
migrations_dir = "migrations"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
COACH_PROVIDER = "none"
COACH_TIMEOUT_MS = "5000"
COACH_CF_SOFT_MAX_CALLS = "40"
COACH_CHAIN_MODE = "cf_first"
