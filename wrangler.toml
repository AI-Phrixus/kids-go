name = "kids-go"
main = "workers/api/src/entry.ts"
compatibility_date = "2025-07-05"

[[d1_databases]]
binding = "DB"
database_name = "kids-go"
database_id = "local-kids-go-placeholder"
migrations_dir = "migrations"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
COACH_PROVIDER = "none"
COACH_TIMEOUT_MS = "2500"
