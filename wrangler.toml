name = "kids-go"
main = "workers/api/src/entry.ts"
compatibility_date = "2025-07-05"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "kids-go"
database_id = "35d8acbd-2abd-4a68-b62e-88dfa1f0fd0d"
migrations_dir = "migrations"

[ai]
binding = "AI"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Ensure security headers / SW path go through Worker entry
run_worker_first = true

# Primary human URL (verified live). Extra routes kept as backup.
[[routes]]
pattern = "go.tdtc.indevs.in/*"
zone_name = "tdtc.indevs.in"

[[routes]]
pattern = "go.tdtc.dpdns.org/*"
zone_name = "tdtc.dpdns.org"

[[routes]]
pattern = "igo.142857.eu.cc/*"
zone_name = "142857.eu.cc"

[vars]
COACH_PROVIDER = "auto"
COACH_TIMEOUT_MS = "2500"
COACH_CF_SOFT_MAX_CALLS = "40"
COACH_CF_MODEL = "@cf/meta/llama-3.1-8b-instruct"
