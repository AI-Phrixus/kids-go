name = "kids-go"
main = "workers/api/src/entry.ts"
compatibility_date = "2025-07-05"

[[d1_databases]]
binding = "DB"
database_name = "kids-go"
database_id = "35d8acbd-2abd-4a68-b62e-88dfa1f0fd0d"
migrations_dir = "migrations"

# Cloudflare Workers AI (free tier: stay on Workers Free for hard stop, no overage bill)
[ai]
binding = "AI"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# auto = Workers AI free first → BYOK third-party → static
COACH_PROVIDER = "auto"
COACH_TIMEOUT_MS = "2500"
# Soft cap: successful CF AI coach calls per UTC day (switch to BYOK before free neuron hard wall)
COACH_CF_SOFT_MAX_CALLS = "40"
COACH_CF_MODEL = "@cf/meta/llama-3.1-8b-instruct"
